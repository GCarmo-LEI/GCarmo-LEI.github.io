<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>LOJA</h1>

      <nav aria-label="Navegação principal">
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Produtos</h2>

        <div class="filtros">
          <label>
            Categoria
            <select id="filtro-categoria">
              <option value="">Todas as categorias</option>
            </select>
          </label>

          <label>
            Ordenar
            <select id="ordenar-preco">
              <option value="">Sem ordenação</option>
              <option value="asc">Preço crescente</option>
              <option value="desc">Preço decrescente</option>
            </select>
          </label>

          <label>
            Pesquisar
            <input
              type="search"
              id="pesquisa"
              placeholder="Nome do produto..."
            />
          </label>
        </div>

        <div id="lista-produtos" class="lista-produtos">
          <p class="mensagem">A carregar produtos...</p>
        </div>
      </section>

      <section id="cesto">
        <h2>Cesto</h2>

        <div id="produtos-selecionados" class="lista-produtos"></div>

        <p id="total-cesto" aria-live="polite">Total: 0 €</p>

        <div class="checkout">
          <label class="checkbox">
            <input type="checkbox" id="estudante" />
            És estudante do DEISI?
          </label>

          <label>
            Cupão de desconto
            <input type="text" id="cupao" placeholder="Ex: black-friday" />
          </label>

          <label>
            Nome
            <input type="text" id="nome" placeholder="O teu nome" />
          </label>

          <button type="button" id="botao-comprar">Comprar</button>

          <div id="resultado-compra" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer>
      <p>Gonçalo Carmo - Universidade Lusófona - 2026/27</p>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
